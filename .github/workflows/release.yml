name: GitHub Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Verify tag matches versionName
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(awk -F'"' '/versionName = / { print $2; exit }' app/build.gradle.kts)"
          if [ "$TAG" != "v${VERSION}" ]; then
            echo "Tag ${TAG} does not match versionName ${VERSION}"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK Platform 36 and 37
        run: |
          sdkmanager "platforms;android-36" "platforms;android-37.0" "platforms;android-37.2" "build-tools;36.0.0"
          if [ ! -d "$ANDROID_HOME/platforms/android-36" ] && [ -d "$ANDROID_HOME/platforms/android-36.0" ]; then
            ln -sfn "$ANDROID_HOME/platforms/android-36.0" "$ANDROID_HOME/platforms/android-36"
          fi
          if [ ! -d "$ANDROID_HOME/platforms/android-37" ]; then
            if [ -d "$ANDROID_HOME/platforms/android-37.2" ]; then
              ln -sfn "$ANDROID_HOME/platforms/android-37.2" "$ANDROID_HOME/platforms/android-37"
            elif [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
              ln -sfn "$ANDROID_HOME/platforms/android-37.0" "$ANDROID_HOME/platforms/android-37"
            else
              echo "Android SDK Platform 37 was not installed"
              ls -la "$ANDROID_HOME/platforms"
              exit 1
            fi
          fi

      - name: Configure release signing
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          KEYSTORE="${GITHUB_WORKSPACE}/release-keystore.jks"
          if [ -n "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "$RELEASE_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE"
            printf '%s\n' \
              "storeFile=release-keystore.jks" \
              "storePassword=${RELEASE_STORE_PASSWORD}" \
              "keyAlias=${RELEASE_KEY_ALIAS}" \
              "keyPassword=${RELEASE_KEY_PASSWORD}" \
              > keystore.properties
          else
            echo "Play 用の RELEASE_KEYSTORE_BASE64 が未設定のため、GitHub 配布専用の署名鍵をこの run で作成します。"
            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -alias github \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass github-ci-sideload \
              -keypass github-ci-sideload \
              -dname "CN=Smart Glasses Detector GitHub Release, O=ozekimasaki, C=JP" \
              -storetype JKS
            printf '%s\n' \
              "storeFile=release-keystore.jks" \
              "storePassword=github-ci-sideload" \
              "keyAlias=github" \
              "keyPassword=github-ci-sideload" \
              > keystore.properties
          fi

      - name: Unit test
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --stacktrace

      - name: Assemble signed release APK and AAB
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Verify signed APK
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/release/app-release.apk"
          AAB="app/build/outputs/bundle/release/app-release.aab"
          test -f "$APK"
          test -f "$AAB"
          APKSIGNER="$(ls -1 "${ANDROID_HOME}/build-tools/"*/apksigner | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK"
          sha256sum "$APK" | awk '{print $1 "  app-release.apk"}' > app/build/outputs/apk/release/app-release.apk.sha256
          sha256sum "$AAB" | awk '{print $1 "  app-release.aab"}' > app/build/outputs/bundle/release/app-release.aab.sha256

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/release/app-release.apk
            app/build/outputs/apk/release/app-release.apk.sha256
            app/build/outputs/bundle/release/app-release.aab
            app/build/outputs/bundle/release/app-release.aab.sha256
          body: |
            スマートグラス検出 ${{ github.ref_name }} の GitHub 配布です。

            ## インストール

            1. [app-release.apk](https://github.com/ozekimasaki/smart-glasses-detector/releases/download/${{ github.ref_name }}/app-release.apk) を Android 端末に入れる
            2. 提供元不明のアプリのインストールを許可する
            3. APK を開いてインストールする

            `v1.0.8` から更新する場合、署名鍵が異なるときは一度アンインストールしてから入れてください。

            ## この版

            - 検出対象を既知メーカーと未知メーカーのヒューリスティックまで拡大
            - Company ID / Service UUID / ペイロード / デバイス名 / Appearance / Class of Device で判定
            - 探索の継続（再起動・Bluetooth 再オン・権限復帰・ハード死の張り直し）
            - `versionName` ${{ github.ref_name }}

            Play 提出用の本番署名鍵は GitHub に置いていません。Secrets `RELEASE_KEYSTORE_BASE64` を設定すると、その鍵で署名します。
